# ============================================================
# RingSlot — Render Blueprint (Infrastructure as Code)
# Deploy with: render blueprint apply
# Docs: https://render.com/docs/blueprint-spec
# ============================================================

services:
  # ── Web Service: API ─────────────────────────────────────────
  - type: web
    name: ringslot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    plan: starter
    region: oregon
    numInstances: 1
    autoDeploy: false
    healthCheckPath: /api/health
    preDeployCommand: node scripts/migrate.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: REQUIRE_DEVICE_VERIFICATION
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ringslot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ringslot-redis
          type: redis
          property: connectionString
      - key: PRIMARY_PROVIDER
        value: smsman
      - key: SMSMAN_CURRENCY
        value: USD
      - fromGroup: ringslot-secrets
      - fromGroup: ringslot-config

  - type: redis
    name: ringslot-redis
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

# ── Database: PostgreSQL ───────────────────────────────────────
databases:
  - name: ringslot-db
    plan: 0.1c-256mb
    region: oregon
    databaseName: ringslot
    user: ringslot
    ipAllowList: []  # Only allow internal connections
    postgresMajorVersion: "15"

# ── Redis ──────────────────────────────────────────────────────
# Note: Render Redis is defined as a service type
# ── Environment Variable Groups ────────────────────────────────
envVarGroups:
  - name: ringslot-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SMSACTIVATE_API_KEY
        sync: false
      - key: FIVESIM_API_KEY
        sync: false
      - key: SMSMAN_API_KEY
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - name: ringslot-config
    envVars:
      - key: FRONTEND_URL
        value: https://www.ringslot.shop
      - key: BACKEND_URL
        value: https://ringslot-backend.onrender.com
      - key: RESEND_FROM_EMAIL
        value: "RingSlot <noreply@ringslot.shop>"
      - key: SUPPORT_EMAIL
        value: support@ringslot.shop
      - key: SUPERADMIN_EMAIL
        sync: false
