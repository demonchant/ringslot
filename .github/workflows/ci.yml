# ============================================================
# RingSlot Backend — CI Pipeline
# Runs on push/PR to main: lint, test, build verification
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ── Lint & Validate ──────────────────────────────────────────
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate package.json
        working-directory: backend
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: Check for syntax errors (dry-run import)
        working-directory: backend
        run: node --check src/server.js

  # ── Test ─────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ringslot_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ringslot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ringslot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ringslot_test:test_password@localhost:5432/ringslot_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-key
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Initialize database schema
        run: psql "$DATABASE_URL" -f backend/schema.sql

      - name: Run build
        working-directory: backend
        run: npm run build

      - name: Smoke test — server starts and responds
        working-directory: backend
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 5
          curl -f http://localhost:4000/api/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

  # ── Docker Build Verification ─────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ringslot-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size
        run: |
          docker image inspect ringslot-api:ci-${{ github.sha }} --format='Image size: {{.Size}}' || true
          echo "Docker build completed successfully"

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production website
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://ringslot-backend.onrender.com
        run: npm run build
