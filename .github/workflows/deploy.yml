# ============================================================
# RingSlot Backend — Deploy to Render
# Triggers after CI passes on push to main
# ============================================================

name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        id: deploy
        run: |
          echo "Triggering deployment to Render..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "response_code=$RESPONSE" >> $GITHUB_OUTPUT
          if [ "$RESPONSE" -ne 200 ] && [ "$RESPONSE" -ne 201 ]; then
            echo "Deploy hook failed with status: $RESPONSE"
            exit 1
          fi
          echo "Deploy hook triggered successfully (HTTP $RESPONSE)"

      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Verify deployment health
        id: health
        run: |
          MAX_RETRIES=10
          RETRY_DELAY=15
          HEALTH_URL="${{ secrets.PRODUCTION_URL }}/api/health"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            RESPONSE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")

            if [ "$RESPONSE" = "200" ]; then
              echo "Deployment is healthy!"
              cat /tmp/health_response.json
              exit 0
            fi

            echo "Got HTTP $RESPONSE, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          echo "Deployment health check failed after $MAX_RETRIES attempts"
          exit 1

  # ── Notifications ──────────────────────────────────────────
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Post success notification
        run: |
          echo "Deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          # Uncomment to add Slack/Discord webhook notification:
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d "{\"text\":\"RingSlot API deployed successfully from commit ${{ github.event.workflow_run.head_sha }}\"}"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Post failure notification
        run: |
          echo "Deployment FAILED!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          # Uncomment to add Slack/Discord webhook notification:
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d "{\"text\":\"ALERT: RingSlot API deployment failed for commit ${{ github.event.workflow_run.head_sha }}\"}"
